name: Internal LLVM test-check generation

on:
  push:
    branches:
      - internal/checkgen-pr-215076

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: internal/checkgen-pr-215076
          fetch-depth: 0

      - name: Configure LLVM for X86
        run: >
          cmake -S llvm -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DLLVM_TARGETS_TO_BUILD=X86
          -DLLVM_ENABLE_PROJECTS=""
          -DLLVM_BUILD_TOOLS=ON
          -DLLVM_INCLUDE_TESTS=OFF
          -DLLVM_INCLUDE_BENCHMARKS=OFF
          -DLLVM_INCLUDE_EXAMPLES=OFF

      - name: Build required tools
        run: ninja -C build llc FileCheck count not

      - name: Regenerate FileCheck assertions
        run: >
          python3 llvm/utils/update_llc_test_checks.py
          --llc-binary build/bin/llc
          llvm/test/CodeGen/X86/vector-idiv-udiv-256.ll

      - name: Commit generated assertions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llvm/test/CodeGen/X86/vector-idiv-udiv-256.ll
          if ! git diff --cached --quiet; then
            git commit -m "[X86] Regenerate vector division checks"
            git push origin HEAD:internal/checkgen-pr-215076
          fi
